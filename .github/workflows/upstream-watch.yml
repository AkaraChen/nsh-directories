name: Upstream Watch

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  check-latest:
    name: Check upstream directories-rs for drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-upstream.mjs --check-latest
